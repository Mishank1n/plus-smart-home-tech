# Kafka
analyzer.kafka.bootstrap-servers=localhost:9092
analyzer.kafka.snapshots-group-id=analyzer-snapshots
analyzer.kafka.hub-events-group-id=analyzer-hub-events

# DataSource
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.dialect=PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://localhost:5432/analyze
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# gRPC
grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.negotiation-type=plaintext
grpc.client.hub-router.enable-keep-alive=true
grpc.client.hub-router.keep-alive-without-calls=true